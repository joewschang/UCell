# HTML and SPA routes must re-fetch the current hashed asset manifest.
map $uri $member_cache_control {
  default "no-store, no-cache, must-revalidate, max-age=0";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $member_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.line-scdn.net https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: data: https:; font-src 'self'; connect-src 'self' https://api.ucell.life https://api.line.me https://access.line.me https://liff.line.me https://accounts.google.com; frame-src https://www.youtube-nocookie.com https://access.line.me https://liff.line.me https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location /r/ {
    limit_except GET { deny all; }
    proxy_set_header Host ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_hide_header Content-Security-Policy;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_pass https://ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io/api/v1/referrals/card/;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}


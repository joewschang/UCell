services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ucell
      POSTGRES_PASSWORD: ucell_dev
      POSTGRES_DB: ucell
    ports:
      - "5432:5432"
    volumes:
      - ucell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucell -d ucell"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ucell_pgdata:

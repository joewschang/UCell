name: UCell Backend CI

on:
  push:
    branches: ["main","develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucell
          POSTGRES_PASSWORD: ucell
          POSTGRES_DB: ucell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucell -d ucell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ucell:ucell@localhost:5432/ucell?schema=public
      NODE_ENV: test
      SWAGGER_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Offline preflight
        run: bash scripts/ci-gate.sh

      - name: Prisma validate
        run: pnpm --filter @ucell/database exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @ucell/database exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @ucell/database exec prisma migrate deploy

      - name: Build
        run: pnpm -r build

      - name: Seed R1.0B golden dataset
        run: pnpm --filter @ucell/database exec ts-node prisma/seed/golden-r1-0b.ts

      - name: DB golden checks
        run: pnpm exec ts-node scripts/db-golden-e2e.ts

      - name: Export OpenAPI
        run: pnpm --filter @ucell/api openapi:export

      - name: Validate OpenAPI
        run: node scripts/openapi-preflight.mjs

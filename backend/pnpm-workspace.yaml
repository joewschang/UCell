packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.5'
  - '@nestjs/core@11.2.5'
  - '@nestjs/platform-fastify@11.2.5'
  - '@nestjs/testing@11.2.5'
overrides:
  '@nestjs/common': 11.2.5
  '@nestjs/core': 11.2.5
  '@nestjs/platform-fastify': 11.2.5
  '@nestjs/testing': 11.2.5
  '@nestjs/cli': ^11.0.0
  '@nestjs/config': ^4.0.0
  '@nestjs/jwt': ^11.0.0
  '@nestjs/swagger': ^11.0.0
  fastify: 5.12.4
  prisma: 6.19.3
  '@prisma/client': 6.19.3
  typescript: 5.9.3
  '@types/node': ^24.0.0

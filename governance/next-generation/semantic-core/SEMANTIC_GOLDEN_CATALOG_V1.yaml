catalogVersion: "1.0"
status: "DESIGN_ONLY_UNTIL_SG_A1"
cases:
  SG-PERSON-BALL-001: "One Person with three effective Balls => PERSON_COUNT=1, BALL_COUNT=3."
  SG-NEW-MEMBER-002: "Second Ball increments NEW_BALL_COUNT, not NEW_QUALIFIED_MEMBER_COUNT."
  SG-MEMBERSHIP-003: "WEB_MEMBER has zero effective formal Qualification; QUALIFIED_MEMBER has >=1."
  SG-REL-004: "Sponsor, Binary Parent and Retail Referrer remain independent."
  SG-BOOTSTRAP-005: "MEMBER_VISIBLE excludes positions 1-3 regardless of caller privilege."
  SG-RESERVOIR-006: "Member routes/tools/DTOs expose zero Reservoir information."
  SG-JOIN-007: "Person→Ball fan-out cannot multiply PERSON_COUNT."
  SG-JOIN-008: "Order→OrderLine fan-out cannot multiply ORDER_COUNT."
  SG-JOIN-009: "OrderLine→Award fan-out cannot multiply product sales."
  SG-HIST-010: "Historical Retail Referral eligibility cannot use current Active."
  SG-HIST-011: "Historical SKU referral rate uses order-line snapshot."
  SG-AUTH-012: "AUTHORITATIVE_ECONOMIC metric cannot be replaced by ad-hoc formula."
  SG-RETURN-013: "Only POSTED returns enter official return numerator."
  SG-RETURN-014: "Operational return period and 30D sales cohort intentionally differ across months."
  SG-RETURN-015: "Partial return uses returned quantity/amount."
  SG-CONV-016: "Only mature subjects enter official cohort denominator."
  SG-CONV-017: "Person converts once; extra Balls do not add conversion."
  SG-CONV-018: "Non-converted Person is censored, not duration zero."
  SG-PLACE-019: "Completed placement duration is PaymentConfirmed→PlacementCommitted for same acquisition."
  SG-PLACE-020: "Cancelled-before-placement is not completed duration."
  SG-PLACE-021: "Open pending age is separate from completed duration."
  SG-ECON-022: "Award, Settlement and Payout are distinct."
  SG-ERP-023: "ERP handoff success does not imply shipment/invoice."
  SG-ERP-024: "Missing ERP import => UNKNOWN, not zero/not-shipped."
  SG-ERP-025: "Imported ERP state carries EXTERNAL_IMPORTED and dataThrough."
  SG-VALUE-026: "ZERO, NULL and UNKNOWN remain distinct."
  SG-RATE-027: "Stored rate 0.125 renders as 12.5 percent."
  SG-TIME-028: "Calendar boundaries use Asia/Taipei."
  SG-CERT-029: "Only CERTIFIED effective metrics can be official KPI."
  SG-CONFLICT-030: "Open authority conflict blocks certification."
  SG-RETAIL-031: "Retail Referral theoretical amount, eligibility and payable amount are distinct immutable recognition facts."
  SG-RETAIL-032: "Inactive Retail Referrer has payable=0 and cannot receive retroactive payout merely by later activation."
  SG-RETAIL-033: "Retail Referral recovery is append-only; a partial return never rewrites the original Award."
  SG-PAPER-034: "Paper source/provenance reuses authoritative order, payment, sponsor and placement flows; it is not a second economic engine."
  SG-ALIAS-035: "Company Sponsor Alias is qualification-only and cannot become a Retail Referrer or disclose Bootstrap topology."
  SG-ONBOARD-036: "Payment confirmation alone does not activate a Qualification; LINE linking creates neither a Person nor a Ball."

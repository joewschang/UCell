limit_req_zone $binary_remote_addr zone=website_api:10m rate=10r/s;
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://scdn.line-apps.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
 location = /api/public/products {
  limit_except GET { deny all; }
  limit_req zone=website_api burst=20 nodelay;
  proxy_set_header Host ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_ssl_server_name on;
  proxy_connect_timeout 5s;
  proxy_read_timeout 10s;
  proxy_pass https://ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io/api/v1/public/website/products;
 }
 location = /api/public/events {
  limit_except GET { deny all; }
  limit_req zone=website_api burst=20 nodelay;
  proxy_set_header Host ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_ssl_server_name on;
  proxy_connect_timeout 5s;
  proxy_read_timeout 10s;
  proxy_pass https://ucell-prod-api.orangepond-b428c382.eastasia.azurecontainerapps.io/api/v1/public/website/events;
 }
 location /api/ { return 404; }
 location ~ /\. { deny all; }
 location ~* \.(css|js|svg|jpg|jpeg|png|webp)$ { expires 1h; try_files $uri =404; }
 location / { try_files $uri $uri/ =404; }
 error_page 404 /404.html;
}

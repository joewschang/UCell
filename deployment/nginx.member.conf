# HTML and SPA routes must re-fetch the current hashed asset manifest.
map $uri $member_cache_control {
  default "no-store, no-cache, must-revalidate, max-age=0";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $member_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.line-scdn.net https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://profile.line-scdn.net https://*.line-scdn.net; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://api.line.me https://access.line.me https://liff.line.me https://accounts.google.com; frame-src https://access.line.me https://liff.line.me https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

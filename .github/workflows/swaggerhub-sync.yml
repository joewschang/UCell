name: OpenAPI governance and private SwaggerHub sync
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swaggerhub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucell
          POSTGRES_PASSWORD: ucell_ci_only
          POSTGRES_DB: ucell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ucell -d ucell"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ucell:ucell_ci_only@127.0.0.1:5432/ucell
      NODE_ENV: test
      ADMIN_AUTH_BYPASS: "false"
      OASDIFF_BIN: ${{ github.workspace }}/.tools/oasdiff
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned OpenAPI tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --retry 3 --max-time 120 https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz -o .tools/oasdiff.tar.gz
          echo '7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f  .tools/oasdiff.tar.gz' | sha256sum --check
          tar -xzf .tools/oasdiff.tar.gz -C .tools
      - name: Install frozen dependencies and build
        working-directory: backend
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm -r build
      - name: Enforce baseline review boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node backend/scripts/openapi-baseline-review.mjs
      - name: Generate, scan, validate, diff, and test
        working-directory: backend
        run: node scripts/openapi-governance.mjs gate
      - name: Upload gated specification
        uses: actions/upload-artifact@v4
        with:
          name: openapi-gated-${{ github.sha }}
          path: |
            backend/openapi.generated.json
            governance/swaggerhub/evidence/gates.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload gate evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-gates-${{ github.sha }}
          path: governance/swaggerhub/evidence/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
  publish:
    needs: verify
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: swaggerhub-docs
    concurrency:
      group: swaggerhub-ragetech-ucell-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: openapi-gated-${{ github.sha }}
          path: .
      - name: Reject a stale default-branch publishing run
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/' + context.payload.repository.default_branch
            });
            if (ref.data.object.sha !== context.sha) throw new Error('STALE_PUBLICATION_COMMIT');
      - name: Publish privately and verify content
        env:
          SWAGGERHUB_API_KEY: ${{ secrets.SWAGGERHUB_API_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node backend/scripts/openapi-governance.mjs publish
      - name: Verify release receipt
        run: node backend/scripts/openapi-governance.mjs release-check
      - name: Preserve publication and Release/RC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaggerhub-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            governance/swaggerhub/evidence/
            backend/release/SWAGGERHUB_SYNC_EVIDENCE.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

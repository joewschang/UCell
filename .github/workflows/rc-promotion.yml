name: RC Promotion Gate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Enforce executable TODO and UAT blockers
        working-directory: backend
        run: |
          node scripts/test-todo-gate.mjs
          node scripts/uat-gate.mjs
      - name: Verify signed release evidence exists
        run: |
          test -f governance/SA_System_Function_Matrix.xlsx
          test -f governance/RELEASE_ALIGNMENT_REPORT.md
          test -f backend/docs/UAT_EXECUTION_R6.csv
          test -f backend/release/R6_RELEASE_GATE.json
      - name: Block unreviewed dependency state
        run: test -f backend/pnpm-lock.yaml && test -f admin/pnpm-lock.yaml

      - name: Fetch same-commit API contract validation evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'swaggerhub-sync.yml', head_sha: context.sha,
              per_page: 100
            });
            const candidates = runs.filter(r => r.head_sha === context.sha &&
              ['push','workflow_dispatch'].includes(r.event) &&
              r.head_branch === context.payload.repository.default_branch);
            let run;
            for (const candidate of candidates) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: candidate.id, filter: 'latest', per_page: 100
              });
              if (jobs.some(j => j.name === 'verify' && j.conclusion === 'success')) { run = candidate; break; }
            }
            if (!run) throw new Error('No successful same-commit API contract verify job');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100
            });
            for (const [name, filename] of [
              ['openapi-gated-' + context.sha, 'swaggerhub-spec.zip']
            ]) {
              const artifact = artifacts.find(a => a.name === name && !a.expired);
              if (!artifact) throw new Error('Missing trusted API contract artifact: ' + name);
              const archive = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.writeFileSync(filename, Buffer.from(archive.data));
            }
      - name: Verify API contract gates and artifact binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance/swaggerhub/evidence
          unzip -p swaggerhub-spec.zip governance/swaggerhub/evidence/gates.json > governance/swaggerhub/evidence/gates.json
          unzip -p swaggerhub-spec.zip backend/openapi.generated.json > backend/openapi.generated.json
          node backend/scripts/openapi-governance.mjs contract-check

      - name: Human approval reminder
        run: echo "Production deployment is allowed only after all R6 gate evidence is PASS and backup/restore drill is signed off."

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs>
<linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03182B"/><stop offset=".62" stop-color="#082B4A"/><stop offset="1" stop-color="#0D3D61"/></linearGradient>
<linearGradient id="goldGrad" x1="0" x2="1"><stop stop-color="#8D641D"/><stop offset=".48" stop-color="#F0D18A"/><stop offset="1" stop-color="#B8872D"/></linearGradient>
<linearGradient id="greenGrad" x1="0" x2="1"><stop stop-color="#2C6258"/><stop offset="1" stop-color="#6D9B82"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#EACD82" stop-opacity=".55"/><stop offset="1" stop-color="#EACD82" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".18"/></filter>

</defs>
<rect width="100%" height="100%" fill="#F7F3EA"/>

<text x="90" y="115" fill="#082B4A" font-size="50" font-weight="700" font-family="sans-serif">健康，是每天累積的選擇</text>
<text x="90" y="165" fill="#6C7C88" font-size="21" font-family="sans-serif">營養補充只是其中一環；飲食、活動、睡眠、壓力與專業照護共同構成健康生活。</text>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="130" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="130" y="380" font-size="42">🥗</text>
<text x="130" y="490" fill="#082B4A" font-size="21" font-weight="700">均衡飲食</text>
<text x="130" y="525" fill="#71808D" font-size="15">多樣、適量、規律</text><circle cx="355" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="355" y="380" font-size="42">🚶</text>
<text x="355" y="490" fill="#082B4A" font-size="21" font-weight="700">規律活動</text>
<text x="355" y="525" fill="#71808D" font-size="15">依身體狀況安排</text><circle cx="580" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="580" y="380" font-size="42">🌙</text>
<text x="580" y="490" fill="#082B4A" font-size="21" font-weight="700">睡眠恢復</text>
<text x="580" y="525" fill="#71808D" font-size="15">建立穩定作息</text><circle cx="805" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="805" y="380" font-size="42">🫶</text>
<text x="805" y="490" fill="#082B4A" font-size="21" font-weight="700">壓力管理</text>
<text x="805" y="525" fill="#71808D" font-size="15">休息與社會支持</text><circle cx="1030" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="1030" y="380" font-size="42">＋</text>
<text x="1030" y="490" fill="#082B4A" font-size="21" font-weight="700">營養補充</text>
<text x="1030" y="525" fill="#71808D" font-size="15">先需求，再選擇</text><circle cx="1255" cy="365" r="76" fill="#FFFFFF" stroke="#DCCDA9" stroke-width="3"/>
<text x="1255" y="380" font-size="42">⚕</text>
<text x="1255" y="490" fill="#082B4A" font-size="21" font-weight="700">專業照護</text>
<text x="1255" y="525" fill="#71808D" font-size="15">疾病與用藥問專業</text></g>
<rect x="90" y="625" width="1220" height="78" rx="22" fill="#EAF2ED"/>
<text x="125" y="675" fill="#315D52" font-size="19" font-family="sans-serif">有疾病、懷孕、哺乳、過敏或正在使用藥物者，使用營養補充品前請先諮詢合格醫療專業人員。</text>
</svg>
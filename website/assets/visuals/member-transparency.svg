<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs>
<linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03182B"/><stop offset=".62" stop-color="#082B4A"/><stop offset="1" stop-color="#0D3D61"/></linearGradient>
<linearGradient id="goldGrad" x1="0" x2="1"><stop stop-color="#8D641D"/><stop offset=".48" stop-color="#F0D18A"/><stop offset="1" stop-color="#B8872D"/></linearGradient>
<linearGradient id="greenGrad" x1="0" x2="1"><stop stop-color="#2C6258"/><stop offset="1" stop-color="#6D9B82"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#EACD82" stop-opacity=".55"/><stop offset="1" stop-color="#EACD82" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".18"/></filter>

</defs>
<rect width="100%" height="100%" fill="#03182B"/>

<rect width="1400" height="800" fill="url(#navyGrad)"/>
<text x="90" y="120" fill="#E8C978" font-size="22" letter-spacing="5" font-family="sans-serif">MEMBER TRANSPARENCY</text>
<text x="90" y="185" fill="#FFFFFF" font-size="48" font-weight="700" font-family="sans-serif">清楚理解，再自主選擇</text>
<g font-family="sans-serif">
<rect x="90" y="270" width="365" height="320" rx="28" fill="#0A3557" stroke="#386080"/>
<text x="130" y="335" fill="#E8C978" font-size="24" font-weight="700">加入前</text>
<text x="130" y="390" fill="#D4E0E8" font-size="19">• 商品、價格與適用資訊</text>
<text x="130" y="435" fill="#D4E0E8" font-size="19">• 契約、制度與退貨權利</text>
<text x="130" y="480" fill="#D4E0E8" font-size="19">• 收入沒有保證、可能為零</text>
<text x="130" y="525" fill="#D4E0E8" font-size="19">• 不鼓勵借貸或囤貨加入</text>
<rect x="520" y="270" width="365" height="320" rx="28" fill="#0A3557" stroke="#386080"/>
<text x="560" y="335" fill="#E8C978" font-size="24" font-weight="700">加入後</text>
<text x="560" y="390" fill="#D4E0E8" font-size="19">• 查詢訂單與適用制度版本</text>
<text x="560" y="435" fill="#D4E0E8" font-size="19">• 權益依有效交易與資格計算</text>
<text x="560" y="480" fill="#D4E0E8" font-size="19">• 使用公司核准之宣傳素材</text>
<text x="560" y="525" fill="#D4E0E8" font-size="19">• 保留稽核與客服處理紀錄</text>
<rect x="950" y="270" width="365" height="320" rx="28" fill="#0A3557" stroke="#386080"/>
<text x="990" y="335" fill="#E8C978" font-size="24" font-weight="700">不繼續時</text>
<text x="990" y="390" fill="#D4E0E8" font-size="19">• 依法與契約申請解除／終止</text>
<text x="990" y="435" fill="#D4E0E8" font-size="19">• 退貨／買回按適用規定處理</text>
<text x="990" y="480" fill="#D4E0E8" font-size="19">• 系統與帳務同步沖銷與追溯</text>
<text x="990" y="525" fill="#D4E0E8" font-size="19">• 法定權利不被內規限縮</text>
</g>
<text x="90" y="685" fill="#AFC2D0" font-size="18" font-family="sans-serif">報備是法定行政程序，不代表主管機關對商品、制度或個人收入結果提供背書或保證。</text>

</svg>